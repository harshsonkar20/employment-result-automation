name: Blogger Auto Publish Engine

on:
  schedule:
    # 1. Daytime Peak (10:00 AM se 8:30 PM IST): Har 40 minute me chalega
    - cron: '*/40 4-15 * * *'

    # 2. Night Off-Peak (9:00 PM se 9:00 AM IST): Har 3 ghante me chalega
    - cron: '0 16-23,0-3/3 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogger-publisher
  cancel-in-progress: false

jobs:
  run-publisher-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Execute Scraper & Publish Posts
        env:
          BLOG_ID: ${{ secrets.BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scraper_bot.py

      - name: Save Cache to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch published_cache.json
          git add published_cache.json
          git commit -m "Sync published cache [skip ci]" || echo "No changes to commit"
          git push || echo "Git push skipped"
